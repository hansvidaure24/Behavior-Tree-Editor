<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <path id="gear-outer" d="M28,-11.974h-7.331l3.517-6.096c1.099-1.899,0.446-4.322-1.449-5.417L8.997-31.42c-1.896-1.094-4.318-0.445-5.416,1.454l-3.576,6.19l-3.576-6.19c-1.098-1.899-3.521-2.548-5.42-1.454L-22.728-23.486c-1.899,1.094-2.548,3.517-1.45,5.417l3.518,6.096H-27.992c-2.208,0-3.998,1.79-3.998,4.002v16c0,2.204,1.79,3.994,3.998,3.994h7.332l-3.518,6.096c-1.098,1.899-0.449,4.322,1.45,5.417l13.737,7.934c1.899,1.094,4.322,0.445,5.42-1.454l3.576-6.19l3.576,6.19c1.098,1.899,3.521,2.548,5.42,1.454l13.737-7.934c1.896-1.095,2.548-3.518,1.449-5.417l-3.517-6.096h7.331c2.208,0,3.998-1.79,3.998-3.994v-16C32-13.784,30.208-11.974,28,-11.974z"/>
    <path id="gear-inner" d="M17.544,-3.978c-0.812-3.604-2.712-6.792-5.33-9.215l3.122-5.409L8.47-22.564l-3.11,5.377c-1.692-0.524-3.49-0.805-5.354-0.805s-3.662,0.281-5.354,0.813l-3.11-5.385l-6.87,3.962l3.126,5.409c-2.622,2.423-4.518,5.611-5.33,9.215H-23.99v8.004h6.464c0.82,3.596,2.72,6.769,5.334,9.191L-15.33,18.65l6.87,3.963l3.126-5.417c1.688,0.523,3.479,0.805,5.339,0.805c1.856,0,3.646-0.281,5.335-0.805l3.13,5.417l6.866-3.963l-3.138-5.433c2.618-2.423,4.518-5.596,5.338-9.191H24v-8.004H17.544z M-0.015,8.067c-4.42,0-8.004-3.584-8.004-8.004s3.584-8.004,8.004-8.004s8.004,3.584,8.004,8.004S4.405,8.067-0.015,8.067z"/>
    <radialGradient id="bg-grad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#0f1729"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="blur2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="32" result="blur3"/>
      <feColorMatrix in="blur3" type="matrix" values="1.2 0 0 0 0.15  0 0.6 0 0 0.05  0 0 1.4 0 0.25  0 0 0 0.5 0" result="outerGlow"/>
      <feColorMatrix in="blur2" type="matrix" values="1.4 0 0 0 0.2  0 0.5 0 0 0.1  0 0 1.6 0 0.3  0 0 0 0.7 0" result="midGlow"/>
      <feColorMatrix in="blur1" type="matrix" values="1 0 0 0 0.1  0 0.4 0 0 0  0 0 1.2 0 0.15  0 0 0 0.9 0" result="innerGlow"/>
      <feMerge>
        <feMergeNode in="outerGlow"/>
        <feMergeNode in="midGlow"/>
        <feMergeNode in="innerGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background with subtle gradient -->
  <rect width="512" height="512" rx="80" fill="url(#bg-grad)"/>

  <!-- Connection lines with dots at joints -->
  <g fill="none" stroke="#2a4a7f" stroke-width="7" stroke-linecap="round">
    <line x1="256" y1="160" x2="148" y2="290"/>
    <line x1="256" y1="160" x2="364" y2="290"/>
    <line x1="148" y1="290" x2="100" y2="400"/>
    <line x1="148" y1="290" x2="204" y2="400"/>
  </g>
  <!-- Small dots where lines meet gears -->
  <g fill="#3a5a8f">
    <circle cx="256" cy="160" r="5"/>
    <circle cx="148" cy="290" r="4"/>
    <circle cx="364" cy="290" r="4"/>
    <circle cx="100" cy="400" r="3"/>
    <circle cx="204" cy="400" r="3"/>
  </g>

  <!-- Root gear — purple, large, with glow -->
  <g filter="url(#glow)">
    <use href="#gear-outer" transform="translate(256,140) scale(1.9)" fill="#9b4dca"/>
    <use href="#gear-inner" transform="translate(256,140) scale(1.9)" fill="#c77dff"/>
    <circle cx="256" cy="140" r="15" fill="#e0b0ff"/>
  </g>

  <!-- Mid-left gear — teal -->
  <use href="#gear-outer" transform="translate(148,290) scale(1.5)" fill="#3a7a85"/>
  <use href="#gear-inner" transform="translate(148,290) scale(1.5)" fill="#53a8b6"/>
  <circle cx="148" cy="290" r="12" fill="#8ad4de"/>

  <!-- Mid-right gear — teal -->
  <use href="#gear-outer" transform="translate(364,290) scale(1.5)" fill="#3a7a85"/>
  <use href="#gear-inner" transform="translate(364,290) scale(1.5)" fill="#53a8b6"/>
  <circle cx="364" cy="290" r="12" fill="#8ad4de"/>

  <!-- Bottom-left gear — lighter teal, smaller -->
  <use href="#gear-outer" transform="translate(100,400) scale(1.1)" fill="#3a6a75"/>
  <use href="#gear-inner" transform="translate(100,400) scale(1.1)" fill="#4a96a3"/>
  <circle cx="100" cy="400" r="9" fill="#7ac0cc"/>

  <!-- Bottom-right gear — lighter teal, smaller -->
  <use href="#gear-outer" transform="translate(204,400) scale(1.1)" fill="#3a6a75"/>
  <use href="#gear-inner" transform="translate(204,400) scale(1.1)" fill="#4a96a3"/>
  <circle cx="204" cy="400" r="9" fill="#7ac0cc"/>
</svg>
